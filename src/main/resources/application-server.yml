server:
  port: 8080

spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  microservices:
    # reads variable from docker-compose.yml
    grayscale-url: ${APP_MICROSERVICES_GRAYSCALE_URL:http://grayscale-service:8080/grayscale}

  storage:
    s3:
      enabled: true # uploads on Amazon S3
      bucket-name: cookie-monsters-images