# local testing in a containerized Postgres DB

services:
  db:
    image: postgres:15-alpine
    container_name: cookie-monsters-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mydb

    ports:
      - "5432:5432"

    volumes:
      - cookie_monsters_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cookie_monsters_postgres_data: